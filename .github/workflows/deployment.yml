name: Deploy to production VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: guwahati-homestay-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy frontend and backend
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20

    steps:
      - name: Configure SSH
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > ~/.ssh/guwahati_deploy
          chmod 600 ~/.ssh/guwahati_deploy
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy on VPS
        env:
          VPS_SSH_HOST: ${{ secrets.VPS_SSH_HOST }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
          VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
        run: |
          ssh \
            -i ~/.ssh/guwahati_deploy \
            -p "${VPS_SSH_PORT:-22}" \
            "$VPS_SSH_USER@$VPS_SSH_HOST" \
            'bash -se' <<'DEPLOY'
          set -Eeuo pipefail

          APP_DIR=/var/www/guwahati-homestay
          export NVM_DIR="$HOME/.nvm"

          if [ -s "$NVM_DIR/nvm.sh" ]; then
            . "$NVM_DIR/nvm.sh"
          fi

          command -v node >/dev/null 2>&1 || {
            echo "Node.js was not found after loading NVM." >&2
            exit 127
          }
          command -v npm >/dev/null 2>&1 || {
            echo "npm was not found after loading NVM." >&2
            exit 127
          }
          command -v pm2 >/dev/null 2>&1 || {
            echo "PM2 was not found after loading NVM." >&2
            exit 127
          }

          cd "$APP_DIR"
          git fetch origin main
          git checkout main
          git pull --ff-only origin main

          npm ci
          npm run build

          cd "$APP_DIR/backend"
          npm ci
          npm run build

          pm2 restart guwahati-backend --update-env
          PORT=3001 pm2 restart guwahati-frontend --update-env
          pm2 save

          backend_ready=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error \
              http://127.0.0.1:5001/api/health; then
              backend_ready=true
              break
            fi
            echo "Waiting for backend readiness ($attempt/30)..."
            sleep 2
          done
          [ "$backend_ready" = true ] || {
            echo "Backend did not become ready on port 5001." >&2
            pm2 logs guwahati-backend --lines 100 --nostream
            exit 1
          }

          frontend_ready=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --head \
              http://127.0.0.1:3001/; then
              frontend_ready=true
              break
            fi
            echo "Waiting for frontend readiness ($attempt/30)..."
            sleep 2
          done
          [ "$frontend_ready" = true ] || {
            echo "Frontend did not become ready on port 3001." >&2
            pm2 logs guwahati-frontend --lines 100 --nostream
            exit 1
          }
          DEPLOY
