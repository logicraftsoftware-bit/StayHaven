name: Deploy to production VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: guwahati-homestay-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy frontend and backend
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20

    steps:
      - name: Configure SSH
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > ~/.ssh/guwahati_deploy
          chmod 600 ~/.ssh/guwahati_deploy
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy on VPS
        env:
          VPS_SSH_HOST: ${{ secrets.VPS_SSH_HOST }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
          VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
        run: |
          ssh \
            -i ~/.ssh/guwahati_deploy \
            -p "${VPS_SSH_PORT:-22}" \
            "$VPS_SSH_USER@$VPS_SSH_HOST" \
            'bash -se' <<'DEPLOY'
          set -Eeuo pipefail

          APP_DIR=/var/www/guwahati-homestay

          cd "$APP_DIR"
          git fetch origin main
          git checkout main
          git pull --ff-only origin main

          npm ci
          npm run build

          cd "$APP_DIR/backend"
          npm ci
          npm run build

          pm2 restart guwahati-backend --update-env
          PORT=3001 pm2 restart guwahati-frontend --update-env
          pm2 save

          curl --fail --silent --show-error \
            http://127.0.0.1:5001/api/health
          curl --fail --silent --show-error --head \
            http://127.0.0.1:3001/
          DEPLOY
